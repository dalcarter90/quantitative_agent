[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent"
version = "0.1.0"
description = "Quantitative trading agent: Python data core, signal, risk and agent layers"
requires-python = ">=3.11"
dependencies = [
    # Normalized store and its query engine, see ADR 0006.
    "pyarrow>=17",
    # Pinned to one minor series: quantagent.data.sqlguard allow-lists the shape
    # of DuckDB's parse tree, and PITSession relies on its lockdown settings.
    # To upgrade, raise the bound and run the tests (see CLAUDE.md).
    "duckdb>=2.0,<2.1",
    # WebSocket client for the market data recorder (quantagent.data.recorder).
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    # Build-time dependency of the C++ extension (cpp/bindings), see ADR 0002.
    "pybind11>=2.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantagent = ["*.pyd", "*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network and not local_data'"
markers = [
    "network: needs internet access to a venue; excluded from the default run",
    "local_data: needs the recordings under data/ (not in git); excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
